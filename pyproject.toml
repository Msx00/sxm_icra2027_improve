[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distrisurg"
version = "0.1.0"
description = "Distributional geometry transport and visibility-constrained completion for stereo endoscopy"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10",
  "PyYAML>=6",
  "torch>=2.1",
  "torchvision>=0.16",
]

[tool.setuptools.packages.find]
include = ["distrisurg*"]
