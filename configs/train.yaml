# Canonical training configuration for the main DistriSurg experiment.
# This file is self-contained: no ablation overlay is required.
data:
  train_root: /home/data/mashixing/dataset_8tb/iMed/datasets/task2-nvs
  train_scenes_file: /home/data/mashixing/dataset_8tb/iMed/comparison/task2-icra/train_scenes.txt
  eval_root: /home/data/mashixing/dataset_18tb/icra2027-diffusion-zero-test-dataset/endovis/dataset89
  height: 512
  width: 640
  min_overlap: 0.5
  num_workers: 4

dss:
  sigma_samples: [-1.0, 0.0, 1.0]
  sigma_weights: [0.2741, 0.4518, 0.2741]
  min_depth_mm: 1.0
  max_depth_mm: 500.0
  min_sigma_mm: 0.25
  max_sigma_mm: 20.0
  base_footprint_px: 0.75
  normal_footprint_px: 0.75
  max_footprint_px: 2.5
  radius: 1
  visibility_temperature_mm: 2.0
  min_support: 0.03

model:
  base_channels: 48
  synthesis_bottleneck_blocks: 6
  source_feature_channels: 16
  reliability_channels: 24
  max_depth_residual_ratio: 0.10
  invalid_depth_confidence_scale: 0.35
  trusted_support: 0.35
  trusted_variance_mm2: 9.0
  trusted_entropy: 1.0
  router_residual_scale: 0.25
  trust_cleanup_kernel: 7

loss:
  hole: 3.0
  visible: 1.0
  seam: 2.0
  gradient: 0.2
  low_frequency: 0.2
  perceptual: 0.1
  # Only local weights are accepted; the training code never downloads them.
  perceptual_weights_path: /home/data/mashixing/.cache/torch/hub/checkpoints/vgg16-397923af.pth
  depth_nll: 0.2
  cycle: 0.2
  router: 0.1
  uncertainty: 0.1
  seam_width: 7

train:
  seed: 6666
  steps: 10000
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  save_every: 500
  log_every: 20
  mixed_precision: true
  amp_dtype: bfloat16
  depth_dropout: 0.15
  grad_clip: 1.0
  forbid_eval_scene_training: true

# Main training behavior is declared directly instead of supplied by A6.
ablation:
  depth_completion: true
  distributional_depth: true
  anisotropic_footprint: true
  physics_router: true
  hard_composition: false
  rgbd_cycle: true
